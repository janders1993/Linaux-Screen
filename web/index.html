<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#000000">
<title>Linaux Screen</title>
<style>
  html, body {
    margin: 0; height: 100%; background: #000; overflow: hidden;
    touch-action: none; -webkit-user-select: none; user-select: none;
    font: 13px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace; color: #cfe;
  }
  video {
    position: fixed; inset: 0; width: 100%; height: 100%;
    object-fit: contain; background: #000;
  }
  #hud {
    position: fixed; top: max(8px, env(safe-area-inset-top)); left: max(8px, env(safe-area-inset-left));
    padding: 8px 10px; border-radius: 8px; background: rgba(0, 0, 0, .75);
  }
  #hud.hidden { display: none; }
  #stats { white-space: pre; }
  #ctl {
    display: block; width: 100%; margin-top: 8px; padding: 10px 12px; border: 1px solid #4a6;
    border-radius: 6px; background: #142; color: #dfe; font: inherit; font-size: 15px;
  }
  #quality { display: flex; gap: 4px; margin-top: 8px; }
  #quality button {
    flex: 1; padding: 8px 4px; border: 1px solid #456; border-radius: 6px;
    background: #123; color: #cde; font: inherit; font-size: 13px;
  }
  #quality button.on { background: #2a5; border-color: #4c7; color: #fff; }
  #ctl.on { background: #431; border-color: #c74; }
  #ctl:disabled { opacity: .5; }
  /* While controlling, the PC's own cursor is in the video; hide the
     device's pointer (iPad trackpad / mouse) so there aren't two. */
  body.controlling video { cursor: none; }
  #status {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    text-align: center; padding: 24px; font-size: 16px; color: #8ab;
  }
  #status.hidden { display: none; }
  #hint {
    position: fixed; left: 50%; bottom: max(24px, env(safe-area-inset-bottom));
    transform: translateX(-50%); padding: 10px 16px; border-radius: 20px;
    background: rgba(0, 0, 0, .7); color: #dde; font-size: 15px;
    pointer-events: none; transition: opacity .4s;
  }
  #hint.hidden { opacity: 0; }
  #sound {
    position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%);
    padding: 14px 22px; border-radius: 24px; background: rgba(0, 0, 0, .8);
    color: #fff; font-size: 17px; pointer-events: none;
  }
  #sound.hidden { display: none; }
</style>
</head>
<body>
<video id="video" autoplay playsinline muted></video>
<div id="status">Connecting…</div>
<div id="hud" class="hidden"><div id="stats">Waiting for video…</div><div id="quality"><button type="button" data-p="saver">Battery saver</button><button type="button" data-p="smooth" class="on">Smooth</button><button type="button" data-p="sharp">Sharp</button><button type="button" data-p="ultra">Ultra</button></div><button id="ctl" type="button">Request control</button></div>
<div id="hint" class="hidden">Tap the screen for fullscreen</div>
<div id="sound" class="hidden">🔊 Tap to enable sound</div>
<script>
"use strict";
const video = document.getElementById("video");
const statusEl = document.getElementById("status");
const hud = document.getElementById("hud");
const statsEl = document.getElementById("stats");
const ctlBtn = document.getElementById("ctl");

let pc = null;
let ws = null;
let encoder = "?";
// Filled in by the app when it serves this page.
const PAGE_VERSION = "__PAGE_VERSION__";
let devices = 0;
// Whether the PC has picked this device for its sound.
let audioOn = false;
let retryTimer = null;
let failures = 0;
// Set when the PC closes the connection on purpose: "disconnected" (from its
// tray menu: wait for a tap) or "stopped" (keep checking quietly, so it
// reconnects by itself when the app is started again).
let ended = null;
// Mouse and keyboard. Nothing is sent to the PC until it accepts this
// device's request ("on"); the PC enforces that too.
let inputAvailable = false;
let control = "off";        // off | pending | on
let retryAt = 0;            // after a denial: when asking again is allowed
let controlNote = "";       // e.g. "Denied on the PC"
let releasing = false;      // this device gave control back itself
// Stream quality for this device only. Every connection starts on Smooth.
let quality = "smooth";
let qualityKbps = 0;

function setStatus(text) {
  statusEl.textContent = text;
  statusEl.classList.toggle("hidden", !text);
}

function connect() {
  clearTimeout(retryTimer);
  const proto = location.protocol === "https:" ? "wss" : "ws";
  ws = new WebSocket(`${proto}://${location.host}/ws`);
  video.srcObject = null;
  lastDisplay = "";
  pc = new RTCPeerConnection({ iceServers: [] });

  pc.ontrack = (e) => {
    // Ask the browser to play frames as soon as they arrive.
    // Only for video: sound needs a small cushion, and forcing it to zero
    // makes the browser constantly stretch and squash it (robotic sound).
    if (e.track.kind === "video") {
      try { e.receiver.jitterBufferTarget = 0; } catch (_) {}
      try { e.receiver.playoutDelayHint = 0; } catch (_) {}
    }
    // Video and audio arrive as separate tracks; play both in the one
    // <video>, which stays muted unless this device is picked for sound.
    const stream = video.srcObject || new MediaStream();
    stream.addTrack(e.track);
    video.srcObject = stream;
  };

  pc.onicecandidate = (e) => {
    if (e.candidate && ws.readyState === WebSocket.OPEN) {
      ws.send(JSON.stringify({
        type: "ice",
        candidate: e.candidate.candidate,
        sdpMLineIndex: e.candidate.sdpMLineIndex ?? 0,
      }));
    }
  };

  pc.onconnectionstatechange = () => {
    const s = pc.connectionState;
    if (s === "connected") { setStatus(""); failures = 0; showFullscreenHint(); }
    else if (s === "failed") retry("Connection failed");
  };

  ws.onmessage = async (e) => {
    const msg = JSON.parse(e.data);
    if (msg.type === "offer") {
      await pc.setRemoteDescription({ type: "offer", sdp: msg.sdp });
      const answer = await pc.createAnswer();
      await pc.setLocalDescription(answer);
      ws.send(JSON.stringify({ type: "answer", sdp: answer.sdp }));
    } else if (msg.type === "ice") {
      try {
        await pc.addIceCandidate({ candidate: msg.candidate, sdpMLineIndex: msg.sdpMLineIndex });
      } catch (err) { console.warn("bad ICE candidate", err); }
    } else if (msg.type === "bye") {
      ended = msg.reason;
      try { pc && pc.close(); } catch (_) {}
      video.srcObject = null;
      setAudio(false);
      setControl("off");
      if (ended === "full") {
        setStatus("Too many devices are already watching. Tap to try again.");
        ended = "disconnected";  // wait for a tap, like disconnect-all
      } else if (ended === "disconnected") setStatus("Disconnected from the PC. Tap to reconnect.");
      else setStatus("Stopped on the PC. This page reconnects by itself when it's started again.");
    } else if (msg.type === "audio") {
      setAudio(msg.on);
    } else if (msg.type === "viewers") {
      devices = msg.count;
    } else if (msg.type === "quality") {
      showQuality(msg.preset, msg.kbps || 0);
    } else if (msg.type === "control") {
      if (msg.state === "denied" || msg.state === "cooldown") {
        retryAt = Date.now() + 1000 * (msg.wait || 30);
        setControl("off", msg.state === "denied" ? "Denied on the PC" : "Denied recently");
      } else if (msg.state === "unavailable") {
        inputAvailable = false;
        setControl("off");
      } else {
        const ended = msg.state === "off" && control === "on" && !releasing;
        releasing = false;
        setControl(msg.state, ended ? "Control ended on the PC" : "");
      }
    } else if (msg.type === "info") {
      encoder = msg.encoder;
      inputAvailable = !!msg.input;
      updateControlButton();
      // The app was updated since this page was loaded: get the new page.
      if (msg.page && msg.page !== PAGE_VERSION) location.reload();
    }
  };

  ws.onopen = () => {
    ended = null;
    showQuality("smooth", 0);
    ws.send(JSON.stringify({ type: "hello", device: deviceName() }));
    sendDisplay();
  };
  ws.onclose = () => {
    setControl("off");  // control ends with the connection
    if (ended === "disconnected") return;  // wait for a tap
    if (ended === "stopped") { retry(null, 5000); return; }
    retry("Disconnected");
  };
  ws.onerror = () => {};
}

// Unmute when the PC picks this device for its sound. Browsers only allow
// sound after the page has been tapped, so ask for a tap if it's refused.
function setAudio(on) {
  audioOn = on;
  const prompt = document.getElementById("sound");
  if (!on) {
    video.muted = true;
    prompt.classList.add("hidden");
    return;
  }
  video.muted = false;
  video.play().then(
    () => prompt.classList.add("hidden"),
    () => { video.muted = true; prompt.classList.remove("hidden"); },
  );
}

// A friendly name for the tray on the PC, e.g. "iPad (192.168.1.120)".
// iPads report themselves as a Mac, so a touch screen gives them away.
function deviceName() {
  const ua = navigator.userAgent;
  if (/iPad/.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1)) return "iPad";
  if (/iPhone/.test(ua)) return "iPhone";
  if (/Android/.test(ua)) return /Mobile/.test(ua) ? "Android phone" : "Android tablet";
  if (/Windows/.test(ua)) return "Windows PC";
  if (/Macintosh/.test(ua)) return "Mac";
  if (/Linux/.test(ua)) return "Linux PC";
  return "Browser";
}

// Tell the PC how much room the video has, in real pixels, so the virtual
// monitor can match it when the app runs with --fit-device (otherwise the
// PC ignores this). That's the page area, not the whole screen:
// in a normal browser tab the address and navigation bars take some, while in
// fullscreen or a home-screen app it's the full screen. Rotating, entering
// fullscreen or the bars appearing all fire a resize, which re-sends this.
function displayInfo() {
  const dpr = window.devicePixelRatio || 1;
  const vv = window.visualViewport;
  const w = vv ? vv.width * vv.scale : window.innerWidth;
  const h = vv ? vv.height * vv.scale : window.innerHeight;
  return {
    type: "display",
    width: Math.round(w * dpr),
    height: Math.round(h * dpr),
    dpr,
  };
}
let lastDisplay = "";
function sendDisplay() {
  if (!ws || ws.readyState !== WebSocket.OPEN) return;
  const info = JSON.stringify(displayInfo());
  if (info === lastDisplay) return;
  lastDisplay = info;
  ws.send(info);
}
let displayTimer = null;
function displayChanged() {
  clearTimeout(displayTimer);
  // Wait for the rotation animation to settle before resizing the monitor.
  displayTimer = setTimeout(sendDisplay, 600);
}
window.addEventListener("resize", displayChanged);
if (screen.orientation) screen.orientation.addEventListener("change", displayChanged);

function retry(reason, delay = 2000) {
  if (retryTimer) return;
  failures++;
  if (reason) {
    setStatus(failures > 3
      ? "Can't reach the PC. Is Linaux Screen running? Still trying…"
      : `${reason}, reconnecting…`);
  }
  try { pc && pc.close(); } catch (_) {}
  try { ws && ws.close(); } catch (_) {}
  retryTimer = setTimeout(() => { retryTimer = null; connect(); }, delay);
}

// A short hint the first time video appears, where fullscreen is possible
// (Android; iPhone Safari can't make a page fullscreen).
let hintShown = false;
function showFullscreenHint() {
  const hint = document.getElementById("hint");
  if (hintShown || document.fullscreenElement || !document.documentElement.requestFullscreen) return;
  hintShown = true;
  hint.classList.remove("hidden");
  setTimeout(() => hint.classList.add("hidden"), 4000);
}
document.addEventListener("fullscreenchange", () => {
  if (document.fullscreenElement) document.getElementById("hint").classList.add("hidden");
});

// Stats overlay: tap with three fingers to toggle.
let last = null;
setInterval(async () => {
  updateControlButton();  // counts down after a denial
  if (!pc || hud.classList.contains("hidden")) return;
  const stats = await pc.getStats();
  stats.forEach((r) => {
    if (r.type !== "inbound-rtp" || r.kind !== "video") return;
    let kbps = 0, fps = r.framesPerSecond || 0, jitterMs = 0;
    if (last && r.timestamp > last.timestamp) {
      kbps = (8 * (r.bytesReceived - last.bytesReceived)) / (r.timestamp - last.timestamp);
    }
    if (r.jitterBufferEmittedCount) {
      jitterMs = (1000 * r.jitterBufferDelay) / r.jitterBufferEmittedCount;
    }
    const decodeMs = r.framesDecoded ? (1000 * (r.totalDecodeTime || 0)) / r.framesDecoded : 0;
    statsEl.textContent =
      `${r.frameWidth || "?"}×${r.frameHeight || "?"} @ ${fps.toFixed(0)} fps\n` +
      `${(kbps / 1000).toFixed(1)} Mbit/s  ${encoder}\n` +
      `buffer ${jitterMs.toFixed(0)} ms  decode ${decodeMs.toFixed(1)} ms\n` +
      `lost ${r.packetsLost ?? 0}  dropped ${r.framesDropped ?? 0}\n` +
      `quality ${QUALITY_NAMES[quality] || quality}${qualityKbps ? ` (${(qualityKbps / 1000).toFixed(0)} Mbit/s target)` : ""}\n` +
      `devices connected ${devices}  sound ${audioOn ? "on" : "off"}\n` +
      `control ${control === "on" ? "ON — touches click on the PC" : control}`;
    last = r;
  });
}, 1000);

document.addEventListener("touchstart", (e) => {
  if (e.touches.length === 3) hud.classList.toggle("hidden");
}, { passive: true });

// ---- Mouse and keyboard control --------------------------------------
// Asked for from the three-finger menu only, so it can't happen by accident.

function send(msg) {
  if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify(msg));
}
// Input goes out only while the PC has accepted this device.
function sendInput(msg) {
  if (control === "on") send(msg);
}

function setControl(state, note = "") {
  if (control === "on" && state !== "on") releaseHeld();
  control = state;
  document.body.classList.toggle("controlling", state === "on");
  controlNote = note;
  updateControlButton();
}

function updateControlButton() {
  const wait = Math.ceil((retryAt - Date.now()) / 1000);
  ctlBtn.classList.toggle("on", control === "on");
  ctlBtn.disabled = !inputAvailable || (control === "off" && wait > 0);
  if (!inputAvailable) ctlBtn.textContent = "Mouse & keyboard unavailable";
  else if (control === "on") ctlBtn.textContent = "Release control";
  else if (control === "pending") ctlBtn.textContent = "Waiting for the PC… (tap to cancel)";
  else if (wait > 0) ctlBtn.textContent = `${controlNote || "Denied"} — ask again in ${wait}s`;
  else ctlBtn.textContent = controlNote ? `${controlNote} — Request control` : "Request control";
}

const QUALITY_NAMES = { saver: "Battery saver", smooth: "Smooth", sharp: "Sharp", ultra: "Ultra" };
function showQuality(preset, kbps) {
  quality = preset;
  qualityKbps = kbps;
  for (const b of document.querySelectorAll("#quality button")) {
    b.classList.toggle("on", b.dataset.p === preset);
  }
}
for (const b of document.querySelectorAll("#quality button")) {
  b.addEventListener("click", () => send({ type: "quality", preset: b.dataset.p }));
}

ctlBtn.addEventListener("click", () => {
  if (control === "on" || control === "pending") {
    releasing = true;
    send({ type: "release-control" });
  }
  else send({ type: "request-control" });
});

// Where a touch lands on the PC's screen (0..1), allowing for the black bars
// object-fit:contain leaves; plus how many PC pixels one page pixel covers.
function toScreen(t) {
  const r = video.getBoundingClientRect();
  const vw = video.videoWidth, vh = video.videoHeight;
  if (!vw || !vh) return null;
  const s = Math.min(r.width / vw, r.height / vh);
  const w = vw * s, h = vh * s;
  return {
    x: (t.clientX - r.left - (r.width - w) / 2) / w,
    y: (t.clientY - r.top - (r.height - h) / 2) / h,
    scale: 1 / s,
  };
}
function movePointer(t) {
  const p = toScreen(t);
  if (p) sendInput({ type: "pointer", x: p.x, y: p.y });
  return p;
}
function clickButton(button) {
  sendInput({ type: "button", button, down: true });
  sendInput({ type: "button", button, down: false });
}
function centre(touches) {
  let x = 0, y = 0;
  for (const t of touches) { x += t.clientX; y += t.clientY; }
  return { clientX: x / touches.length, clientY: y / touches.length };
}

// One finger: tap = click, hold = right-click, drag = hold the left button
// and move (drags windows). Two fingers: scroll. Three: the menu, never sent.
const HOLD_MS = 500, MOVE_PX = 10;
let gesture = null;

function inMenu(e) { return hud.contains(e.target); }

document.addEventListener("touchstart", (e) => {
  if (control !== "on" || inMenu(e)) return;
  e.preventDefault();
  const n = e.touches.length;
  if (!gesture) {
    if (n !== 1) return;
    const t = e.touches[0];
    gesture = { mode: "tap", start: { clientX: t.clientX, clientY: t.clientY }, last: null };
    gesture.timer = setTimeout(() => {
      if (gesture && gesture.mode === "tap") {
        gesture.mode = "done";
        movePointer(gesture.start);
        clickButton("right");
        if (navigator.vibrate) navigator.vibrate(20);
      }
    }, HOLD_MS);
    return;
  }
  clearTimeout(gesture.timer);
  if (gesture.mode === "drag") sendInput({ type: "button", button: "left", down: false });
  if (n === 2 && gesture.mode !== "menu") {
    gesture.mode = "scroll";
    gesture.last = centre(e.touches);
  } else if (n >= 3) {
    gesture.mode = "menu";
  }
}, { passive: false });

document.addEventListener("touchmove", (e) => {
  if (!gesture) return;
  e.preventDefault();
  if (gesture.mode === "tap") {
    const t = e.touches[0];
    if (Math.hypot(t.clientX - gesture.start.clientX, t.clientY - gesture.start.clientY) < MOVE_PX) return;
    clearTimeout(gesture.timer);
    gesture.mode = "drag";
    movePointer(gesture.start);
    sendInput({ type: "button", button: "left", down: true });
    movePointer(t);
  } else if (gesture.mode === "drag") {
    movePointer(e.touches[0]);
  } else if (gesture.mode === "scroll" && e.touches.length >= 2) {
    const c = centre(e.touches);
    const p = toScreen(c);
    const k = p ? p.scale : 1;
    // Content follows the fingers, like scrolling on the phone itself.
    const dx = -(c.clientX - gesture.last.clientX) * k;
    const dy = -(c.clientY - gesture.last.clientY) * k;
    gesture.last = c;
    if (dx || dy) sendInput({ type: "scroll", dx, dy });
  }
}, { passive: false });

function endGesture(e, cancelled) {
  if (!gesture) return;
  e.preventDefault();
  if (e.touches.length > 0) return;  // wait until every finger is up
  clearTimeout(gesture.timer);
  if (gesture.mode === "tap" && !cancelled) {
    movePointer(gesture.start);
    clickButton("left");
  } else if (gesture.mode === "drag") {
    sendInput({ type: "button", button: "left", down: false });
  } else if (gesture.mode === "scroll") {
    sendInput({ type: "scroll", dx: 0, dy: 0, end: true });
  }
  gesture = null;
  if (audioOn) setAudio(true);  // a tap still counts as permission for sound
}
document.addEventListener("touchend", (e) => endGesture(e, false), { passive: false });
document.addEventListener("touchcancel", (e) => endGesture(e, true), { passive: false });

// A trackpad or mouse (iPad Magic Keyboard, Bluetooth mouse): the pointer
// follows it, buttons click as they are, two-finger swipes scroll. Touch and
// pen go through the touch gestures above instead.
const MOUSE_BUTTONS = { 0: "left", 1: "middle", 2: "right" };
const mouseHeld = new Set();
function isMouse(e) { return e.pointerType === "mouse"; }
document.addEventListener("pointermove", (e) => {
  if (control === "on" && isMouse(e)) movePointer(e);
});
document.addEventListener("pointerdown", (e) => {
  const button = MOUSE_BUTTONS[e.button];
  if (control !== "on" || !isMouse(e) || inMenu(e) || !button) return;
  e.preventDefault();
  movePointer(e);
  mouseHeld.add(button);
  sendInput({ type: "button", button, down: true });
});
document.addEventListener("pointerup", (e) => {
  const button = MOUSE_BUTTONS[e.button];
  if (!isMouse(e) || !mouseHeld.delete(button)) return;
  e.preventDefault();
  movePointer(e);
  sendInput({ type: "button", button, down: false });
});
// Right-click / two-finger click: the PC shows its menu, not the iPad.
document.addEventListener("contextmenu", (e) => {
  if (control === "on") e.preventDefault();
});
let wheelEnd = null;
document.addEventListener("wheel", (e) => {
  if (control !== "on" || inMenu(e)) return;
  e.preventDefault();
  const p = toScreen(e);
  // Pixels on the page → PC pixels; "lines" mode is rare (some mice).
  const k = (p ? p.scale : 1) * (e.deltaMode === 1 ? 40 : 1);
  sendInput({ type: "scroll", dx: e.deltaX * k, dy: e.deltaY * k });
  clearTimeout(wheelEnd);
  wheelEnd = setTimeout(() => sendInput({ type: "scroll", dx: 0, dy: 0, end: true }), 150);
}, { passive: false });

// Physical keyboards only. Keys go by position (KeyboardEvent.code), so the
// PC's keyboard layout decides the character. The iPad's Cmd key is Super.
const held = new Set();
function releaseHeld() {
  for (const code of held) {
    held.delete(code);
    send({ type: "key", code, down: false });
  }
  if (gesture && gesture.mode === "drag") send({ type: "button", button: "left", down: false });
  for (const button of mouseHeld) send({ type: "button", button, down: false });
  mouseHeld.clear();
  gesture = null;
}
document.addEventListener("keydown", (e) => {
  if (control !== "on") {
    if (e.key === "s") hud.classList.toggle("hidden");
    return;
  }
  e.preventDefault();
  if (e.repeat || !e.code || held.has(e.code)) return;
  held.add(e.code);
  sendInput({ type: "key", code: e.code, down: true });
});
document.addEventListener("keyup", (e) => {
  if (control !== "on" || !e.code) return;
  e.preventDefault();
  if (held.delete(e.code)) sendInput({ type: "key", code: e.code, down: false });
  // Safari doesn't report letting go of other keys while Cmd is held, so
  // treat letting go of Cmd as letting go of everything.
  if (e.code.startsWith("Meta") || e.code.startsWith("OS")) releaseHeld();
});
// Switching away from the page: let go of everything so nothing sticks.
window.addEventListener("blur", () => releaseHeld());
document.addEventListener("visibilitychange", () => { if (document.hidden) releaseHeld(); });

// Android: a tap goes fullscreen. (iPhone Safari can't fullscreen a page;
// use Share > Add to Home Screen instead.)
document.addEventListener("click", () => {
  if (ended === "disconnected") {
    ended = null;
    setStatus("Connecting…");
    connect();
  }
  const el = document.documentElement;
  if (!document.fullscreenElement && el.requestFullscreen) {
    el.requestFullscreen().catch(() => {});
  }
  if (audioOn) setAudio(true);  // this tap counts as permission to play sound
  else video.play().catch(() => {});
});

connect();
</script>
</body>
</html>
