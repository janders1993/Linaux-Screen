<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#000000">
<title>Linaux Screen</title>
<style>
  html, body {
    margin: 0; height: 100%; background: #000; overflow: hidden;
    touch-action: none; -webkit-user-select: none; user-select: none;
    font: 13px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace; color: #cfe;
  }
  video {
    position: fixed; inset: 0; width: 100%; height: 100%;
    object-fit: contain; background: #000;
  }
  #hud {
    position: fixed; top: max(8px, env(safe-area-inset-top)); left: max(8px, env(safe-area-inset-left));
    padding: 6px 10px; border-radius: 6px; background: rgba(0, 0, 0, .65);
    white-space: pre; pointer-events: none;
  }
  #hud.hidden { display: none; }
  #status {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    text-align: center; padding: 24px; font-size: 16px; color: #8ab;
  }
  #status.hidden { display: none; }
  #hint {
    position: fixed; left: 50%; bottom: max(24px, env(safe-area-inset-bottom));
    transform: translateX(-50%); padding: 10px 16px; border-radius: 20px;
    background: rgba(0, 0, 0, .7); color: #dde; font-size: 15px;
    pointer-events: none; transition: opacity .4s;
  }
  #hint.hidden { opacity: 0; }
  #sound {
    position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%);
    padding: 14px 22px; border-radius: 24px; background: rgba(0, 0, 0, .8);
    color: #fff; font-size: 17px; pointer-events: none;
  }
  #sound.hidden { display: none; }
</style>
</head>
<body>
<video id="video" autoplay playsinline muted></video>
<div id="status">Connecting…</div>
<div id="hud" class="hidden"></div>
<div id="hint" class="hidden">Tap the screen for fullscreen</div>
<div id="sound" class="hidden">🔊 Tap to enable sound</div>
<script>
"use strict";
const video = document.getElementById("video");
const statusEl = document.getElementById("status");
const hud = document.getElementById("hud");

let pc = null;
let ws = null;
let encoder = "?";
// Filled in by the app when it serves this page.
const PAGE_VERSION = "__PAGE_VERSION__";
let devices = 0;
// Whether the PC has picked this device for its sound.
let audioOn = false;
let retryTimer = null;
let failures = 0;
// Set when the PC closes the connection on purpose: "disconnected" (from its
// tray menu: wait for a tap) or "stopped" (keep checking quietly, so it
// reconnects by itself when the app is started again).
let ended = null;

function setStatus(text) {
  statusEl.textContent = text;
  statusEl.classList.toggle("hidden", !text);
}

function connect() {
  clearTimeout(retryTimer);
  const proto = location.protocol === "https:" ? "wss" : "ws";
  ws = new WebSocket(`${proto}://${location.host}/ws`);
  video.srcObject = null;
  lastDisplay = "";
  pc = new RTCPeerConnection({ iceServers: [] });

  pc.ontrack = (e) => {
    // Ask the browser to play frames as soon as they arrive.
    // Only for video: sound needs a small cushion, and forcing it to zero
    // makes the browser constantly stretch and squash it (robotic sound).
    if (e.track.kind === "video") {
      try { e.receiver.jitterBufferTarget = 0; } catch (_) {}
      try { e.receiver.playoutDelayHint = 0; } catch (_) {}
    }
    // Video and audio arrive as separate tracks; play both in the one
    // <video>, which stays muted unless this device is picked for sound.
    const stream = video.srcObject || new MediaStream();
    stream.addTrack(e.track);
    video.srcObject = stream;
  };

  pc.onicecandidate = (e) => {
    if (e.candidate && ws.readyState === WebSocket.OPEN) {
      ws.send(JSON.stringify({
        type: "ice",
        candidate: e.candidate.candidate,
        sdpMLineIndex: e.candidate.sdpMLineIndex ?? 0,
      }));
    }
  };

  pc.onconnectionstatechange = () => {
    const s = pc.connectionState;
    if (s === "connected") { setStatus(""); failures = 0; showFullscreenHint(); }
    else if (s === "failed") retry("Connection failed");
  };

  ws.onmessage = async (e) => {
    const msg = JSON.parse(e.data);
    if (msg.type === "offer") {
      await pc.setRemoteDescription({ type: "offer", sdp: msg.sdp });
      const answer = await pc.createAnswer();
      await pc.setLocalDescription(answer);
      ws.send(JSON.stringify({ type: "answer", sdp: answer.sdp }));
    } else if (msg.type === "ice") {
      try {
        await pc.addIceCandidate({ candidate: msg.candidate, sdpMLineIndex: msg.sdpMLineIndex });
      } catch (err) { console.warn("bad ICE candidate", err); }
    } else if (msg.type === "bye") {
      ended = msg.reason;
      try { pc && pc.close(); } catch (_) {}
      video.srcObject = null;
      setAudio(false);
      if (ended === "full") {
        setStatus("Too many devices are already watching. Tap to try again.");
        ended = "disconnected";  // wait for a tap, like disconnect-all
      } else if (ended === "disconnected") setStatus("Disconnected from the PC. Tap to reconnect.");
      else setStatus("Stopped on the PC. This page reconnects by itself when it's started again.");
    } else if (msg.type === "audio") {
      setAudio(msg.on);
    } else if (msg.type === "viewers") {
      devices = msg.count;
    } else if (msg.type === "info") {
      encoder = msg.encoder;
      // The app was updated since this page was loaded: get the new page.
      if (msg.page && msg.page !== PAGE_VERSION) location.reload();
    }
  };

  ws.onopen = () => {
    ended = null;
    ws.send(JSON.stringify({ type: "hello", device: deviceName() }));
    sendDisplay();
  };
  ws.onclose = () => {
    if (ended === "disconnected") return;  // wait for a tap
    if (ended === "stopped") { retry(null, 5000); return; }
    retry("Disconnected");
  };
  ws.onerror = () => {};
}

// Unmute when the PC picks this device for its sound. Browsers only allow
// sound after the page has been tapped, so ask for a tap if it's refused.
function setAudio(on) {
  audioOn = on;
  const prompt = document.getElementById("sound");
  if (!on) {
    video.muted = true;
    prompt.classList.add("hidden");
    return;
  }
  video.muted = false;
  video.play().then(
    () => prompt.classList.add("hidden"),
    () => { video.muted = true; prompt.classList.remove("hidden"); },
  );
}

// A friendly name for the tray on the PC, e.g. "iPad (192.168.1.120)".
// iPads report themselves as a Mac, so a touch screen gives them away.
function deviceName() {
  const ua = navigator.userAgent;
  if (/iPad/.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1)) return "iPad";
  if (/iPhone/.test(ua)) return "iPhone";
  if (/Android/.test(ua)) return /Mobile/.test(ua) ? "Android phone" : "Android tablet";
  if (/Windows/.test(ua)) return "Windows PC";
  if (/Macintosh/.test(ua)) return "Mac";
  if (/Linux/.test(ua)) return "Linux PC";
  return "Browser";
}

// Tell the PC how much room the video has, in real pixels, so the virtual
// monitor can match it when the app runs with --fit-device (otherwise the
// PC ignores this). That's the page area, not the whole screen:
// in a normal browser tab the address and navigation bars take some, while in
// fullscreen or a home-screen app it's the full screen. Rotating, entering
// fullscreen or the bars appearing all fire a resize, which re-sends this.
function displayInfo() {
  const dpr = window.devicePixelRatio || 1;
  const vv = window.visualViewport;
  const w = vv ? vv.width * vv.scale : window.innerWidth;
  const h = vv ? vv.height * vv.scale : window.innerHeight;
  return {
    type: "display",
    width: Math.round(w * dpr),
    height: Math.round(h * dpr),
    dpr,
  };
}
let lastDisplay = "";
function sendDisplay() {
  if (!ws || ws.readyState !== WebSocket.OPEN) return;
  const info = JSON.stringify(displayInfo());
  if (info === lastDisplay) return;
  lastDisplay = info;
  ws.send(info);
}
let displayTimer = null;
function displayChanged() {
  clearTimeout(displayTimer);
  // Wait for the rotation animation to settle before resizing the monitor.
  displayTimer = setTimeout(sendDisplay, 600);
}
window.addEventListener("resize", displayChanged);
if (screen.orientation) screen.orientation.addEventListener("change", displayChanged);

function retry(reason, delay = 2000) {
  if (retryTimer) return;
  failures++;
  if (reason) {
    setStatus(failures > 3
      ? "Can't reach the PC. Is Linaux Screen running? Still trying…"
      : `${reason}, reconnecting…`);
  }
  try { pc && pc.close(); } catch (_) {}
  try { ws && ws.close(); } catch (_) {}
  retryTimer = setTimeout(() => { retryTimer = null; connect(); }, delay);
}

// A short hint the first time video appears, where fullscreen is possible
// (Android; iPhone Safari can't make a page fullscreen).
let hintShown = false;
function showFullscreenHint() {
  const hint = document.getElementById("hint");
  if (hintShown || document.fullscreenElement || !document.documentElement.requestFullscreen) return;
  hintShown = true;
  hint.classList.remove("hidden");
  setTimeout(() => hint.classList.add("hidden"), 4000);
}
document.addEventListener("fullscreenchange", () => {
  if (document.fullscreenElement) document.getElementById("hint").classList.add("hidden");
});

// Stats overlay: tap with three fingers to toggle.
let last = null;
setInterval(async () => {
  if (!pc || hud.classList.contains("hidden")) return;
  const stats = await pc.getStats();
  stats.forEach((r) => {
    if (r.type !== "inbound-rtp" || r.kind !== "video") return;
    let kbps = 0, fps = r.framesPerSecond || 0, jitterMs = 0;
    if (last && r.timestamp > last.timestamp) {
      kbps = (8 * (r.bytesReceived - last.bytesReceived)) / (r.timestamp - last.timestamp);
    }
    if (r.jitterBufferEmittedCount) {
      jitterMs = (1000 * r.jitterBufferDelay) / r.jitterBufferEmittedCount;
    }
    const decodeMs = r.framesDecoded ? (1000 * (r.totalDecodeTime || 0)) / r.framesDecoded : 0;
    hud.textContent =
      `${r.frameWidth || "?"}×${r.frameHeight || "?"} @ ${fps.toFixed(0)} fps\n` +
      `${(kbps / 1000).toFixed(1)} Mbit/s  ${encoder}\n` +
      `buffer ${jitterMs.toFixed(0)} ms  decode ${decodeMs.toFixed(1)} ms\n` +
      `lost ${r.packetsLost ?? 0}  dropped ${r.framesDropped ?? 0}\n` +
      `devices connected ${devices}  sound ${audioOn ? "on" : "off"}`;
    last = r;
  });
}, 1000);

document.addEventListener("touchstart", (e) => {
  if (e.touches.length === 3) hud.classList.toggle("hidden");
}, { passive: true });
document.addEventListener("keydown", (e) => {
  if (e.key === "s") hud.classList.toggle("hidden");
});

// Android: a tap goes fullscreen. (iPhone Safari can't fullscreen a page;
// use Share > Add to Home Screen instead.)
document.addEventListener("click", () => {
  if (ended === "disconnected") {
    ended = null;
    setStatus("Connecting…");
    connect();
  }
  const el = document.documentElement;
  if (!document.fullscreenElement && el.requestFullscreen) {
    el.requestFullscreen().catch(() => {});
  }
  if (audioOn) setAudio(true);  // this tap counts as permission to play sound
  else video.play().catch(() => {});
});

connect();
</script>
</body>
</html>
